<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#39051f" />
    <title>Sin conexión | ÁGORA</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh; margin: 0; padding: 28px;
        display: grid; place-items: center;
        background: #fbefea; color: #39051f;
        font: 15px/1.65 Arial, sans-serif;
      }
      main {
        width: 100%; max-width: 440px; padding: 44px 35px;
        border-radius: 24px; background: #fff;
        box-shadow: 0 12px 40px rgba(57, 5, 31, .06);
        text-align: center;
      }
      .simbolo {
        width: 64px; height: 64px; margin: 0 auto 20px;
        display: grid; place-items: center;
        border-radius: 19px; color: #39051f;
        background: #fff0ed; font-size: 30px;
      }
      h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.25; }
      p { margin: 0; color: #805d6c; }
      a {
        display: inline-block; margin-top: 28px; padding: 12px 24px;
        color: #fff; background: #39051f; border-radius: 12px;
        font-weight: bold; text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #ff6b5f; outline-offset: 4px; }
      small { display: block; margin-top: 24px; color: #927986; }
      @media (max-width: 480px) { main { padding: 36px 24px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="simbolo" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 2l20 20" />
          <path d="M8.5 8.5a10 10 0 0 1 13 1.5" />
          <path d="M2.5 9.5a15 15 0 0 1 3.2-2" />
          <path d="M6 13a9 9 0 0 1 7.4-2.2" />
          <path d="M17.5 13.5a9 9 0 0 1 1.1 1" />
          <path d="M10 17a3 3 0 0 1 4 0" />
          <path d="M12 21h.01" />
        </svg>
      </div>
      <h1>Estás sin conexión</h1>
      <p>No pudimos cargar esta página. Cuando recuperes Internet, podrás continuar usando ÁGORA.</p>
      <a href="">Volver a intentar</a>
      <small>Los check-ins sin Internet estarán disponibles al completar el módulo offline.</small>
    </main>
  </body>
</html>
